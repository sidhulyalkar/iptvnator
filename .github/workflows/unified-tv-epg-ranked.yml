name: Unified TV EPG ranked search

on:
  pull_request:
    paths:
      - 'apps/electron-backend/src/app/events/database/epg-db.events*'
      - 'apps/electron-backend/src/app/events/database/epg-search-plan.util*'
      - '.github/workflows/unified-tv-epg-ranked.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run backend unit and SQLite tests
        run: pnpm nx test electron-backend --runInBand --output-style=static
        env:
          CI: true
      - name: Check backend TypeScript
        run: pnpm run typecheck:backend
      - name: Check spec TypeScript
        run: pnpm run typecheck:spec
      - name: Lint Electron backend
        run: pnpm nx lint electron-backend --output-style=static
