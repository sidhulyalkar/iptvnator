name: Unified TV EPG integration checks

on:
  pull_request:
    paths:
      - 'libs/epg/data-access/**'
      - 'libs/ui/epg/**'
      - 'libs/playlist/m3u/feature-player/**'
      - '.github/workflows/unified-tv-epg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-search:
    name: EPG bridge and guide regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused EPG, M3U and guide tests
        run: pnpm nx run-many --target=test --projects=epg-data-access,playlist-m3u-feature-player,ui-epg --parallel=2 --output-style=static
        env:
          CI: true
      - name: Typecheck renderer
        run: pnpm run typecheck:web
      - name: Check spec TypeScript
        run: pnpm run typecheck:spec
      - name: Lint changed libraries
        run: pnpm nx run-many --target=lint --projects=epg-data-access,playlist-m3u-feature-player,ui-epg --parallel=2 --output-style=static
