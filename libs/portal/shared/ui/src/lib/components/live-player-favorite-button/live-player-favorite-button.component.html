<button
    mat-icon-button
    type="button"
    [attr.data-test-id]="testId()"
    [disabled]="pending() || (!known() && !retryable())"
    [attr.aria-pressed]="known() ? isFavorite() : null"
    [attr.aria-label]="
        ((retryable()
            ? 'PLAYBACK_DIAGNOSTICS.ACTION_RETRY'
            : known()
              ? (isFavorite()
                    ? 'CHANNELS.REMOVE_FAVORITE'
                    : 'CHANNELS.ADD_FAVORITE')
              : 'CHANNELS.FAVORITES') | translate) +
        ': ' + channelName() +
        (sourceLabel() ? ' · ' + sourceLabel() : '')
    "
    (click)="activate()"
>
    <mat-icon aria-hidden="true">{{
        retryable() ? 'refresh' : known() && isFavorite() ? 'star' : 'star_border'
    }}</mat-icon>
</button>
